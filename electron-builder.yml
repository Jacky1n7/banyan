appId: io.github.jacky1n7.banyan.desktop
productName: Banyan
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  output: release
electronDist: node_modules/electron/dist
icon: build/desktop-icon.png
asar: false
files:
  - dist/**/*
  - drizzle/**/*
  - package.json
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlementsInherit: null
win:
  target:
    - nsis
    - zip
linux:
  target:
    - AppImage
    - deb
    - rpm
  maintainer: Jacky1n7 <146931635+Jacky1n7@users.noreply.github.com>
publish:
  provider: github
  owner: Jacky1n7
  repo: banyan
  releaseType: release
  publishAutoUpdate: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
afterPack: scripts/desktop/afterPack.mjs
afterSign: scripts/desktop/afterSign.mjs
