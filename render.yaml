# 警告：本 fork 的 anyrouter 支持依赖一个跑在宿主机上的真浏览器后端
# （checkin-backend/）。托管平台起不了 xvfb 和真浏览器，也访问不到你主机上的
# 那个后端，所以这份 blueprint 部署出来的实例只能用于非 anyrouter 站点。
# 详见 README 顶部说明。
services:
  - type: web
    name: metapi
    runtime: docker
    repo: https://github.com/Jacky1n7/metapi-fork
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: AUTH_TOKEN
        sync: false
      - key: PROXY_TOKEN
        sync: false
      - key: TZ
        value: Asia/Shanghai
      - key: PORT
        value: "4000"
      - key: DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: mysql
      - key: DB_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CHECKIN_CRON
        value: "0 8 * * *"
      - key: BALANCE_REFRESH_CRON
        value: "0 * * * *"
